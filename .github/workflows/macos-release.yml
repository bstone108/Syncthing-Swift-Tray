name: macOS Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# PR verification can cancel in-progress runs. Real releases are serialized so
# two publishes cannot assign the same YYYY.M.D.N.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Decide packaging mode
    runs-on: ubuntu-24.04
    outputs:
      compile: ${{ steps.decide.outputs.compile }}
      package: ${{ steps.decide.outputs.package }}
      release: ${{ steps.decide.outputs.release }}
      app_version: ${{ steps.version.outputs.app_version }}
      sparkle_public_key: ${{ steps.sparkle.outputs.public_key }}
    steps:
      - name: Classify pull request vs real release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "PR/test run: compile only; do not sign, notarize, assign date.build, or publish."
            echo "compile=1" >> "${GITHUB_OUTPUT}"
            echo "package=0" >> "${GITHUB_OUTPUT}"
            echo "release=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch: assign next America/Chicago date.build and publish."
            echo "compile=0" >> "${GITHUB_OUTPUT}"
            echo "package=1" >> "${GITHUB_OUTPUT}"
            echo "release=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            if gh release view "${REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
              echo "Tag ${REF_NAME} already has a GitHub release; skipping the tag-triggered rebuild."
              echo "compile=0" >> "${GITHUB_OUTPUT}"
              echo "package=0" >> "${GITHUB_OUTPUT}"
              echo "release=0" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Tag ${REF_NAME} has no release yet; package that version and publish."
            echo "compile=0" >> "${GITHUB_OUTPUT}"
            echo "package=1" >> "${GITHUB_OUTPUT}"
            echo "release=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Unsupported event ${EVENT_NAME}; skipping."
          echo "compile=0" >> "${GITHUB_OUTPUT}"
          echo "package=0" >> "${GITHUB_OUTPUT}"
          echo "release=0" >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        if: steps.decide.outputs.package == '1'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Assign shared date.build version
        id: version
        if: steps.decide.outputs.package == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/next-date-build-version.py --self-test
          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="$(python3 scripts/next-date-build-version.py --from-tag "${REF_NAME}")"
          else
            version="$(python3 scripts/next-date-build-version.py)"
          fi
          echo "app_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Both Mac jobs will stamp ${version}"

      - name: Derive Sparkle public key
        id: sparkle
        if: steps.decide.outputs.package == '1'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages pynacl
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not set; SUPublicEDKey stays the template placeholder and appcast signing will be skipped."
            echo "public_key=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          pub="$(python3 scripts/generate-sparkle-appcast.py --print-public-key)"
          if [[ -z "${pub}" ]]; then
            echo "Failed to derive Sparkle public key from SPARKLE_ED_PRIVATE_KEY." >&2
            exit 1
          fi
          echo "public_key=${pub}" >> "${GITHUB_OUTPUT}"
          echo "Derived SUPublicEDKey (${#pub} chars) for Info.plist stamping"

  compile-macos:
    name: Compile Release (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.compile == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            extra_arch: "universal"
          - runner: macos-15-intel
            arch: x86_64
            extra_arch: "none"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify packaging helpers
        run: |
          python3 scripts/next-date-build-version.py --self-test
          python3 -m pip install --user --break-system-packages pynacl
          python3 scripts/generate-sparkle-appcast.py --self-test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Compile unsigned ${{ matrix.arch }} Release
        env:
          SYNCTHINGTRAY_ARCH: ${{ matrix.arch }}
        run: ./scripts/package-macos.sh --compile-only

      - name: Compile unsigned universal Release
        if: matrix.extra_arch == 'universal'
        env:
          SYNCTHINGTRAY_ARCH: universal
        run: ./scripts/package-macos.sh --compile-only

  package-macos:
    name: Sign, notarize, and staple (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.package == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            extra_arch: "universal"
          - runner: macos-15-intel
            arch: x86_64
            extra_arch: "none"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify packaging helpers
        run: |
          python3 scripts/next-date-build-version.py --self-test
          python3 -m pip install --user --break-system-packages pynacl
          python3 scripts/generate-sparkle-appcast.py --self-test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-apple-signing-cert.sh

      - name: Build, sign, notarize, and staple ${{ matrix.arch }}
        id: package
        env:
          MACOS_CODESIGN_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNCTHINGTRAY_RELEASE: ${{ needs.gate.outputs.release }}
          SYNCTHINGTRAY_VERSION: ${{ needs.gate.outputs.app_version }}
          SYNCTHINGTRAY_ARCH: ${{ matrix.arch }}
          SYNCTHINGTRAY_VERSION_DEBUG: "1"
          SPARKLE_ED_PUBLIC_KEY: ${{ needs.gate.outputs.sparkle_public_key }}
        run: ./scripts/package-macos.sh

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-${{ matrix.arch }}
          path: |
            build/SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-${{ matrix.arch }}.zip
            build/SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-${{ matrix.arch }}.dmg
            build/SHA256SUMS-macos-${{ matrix.arch }}
          if-no-files-found: error

      - name: Build, sign, notarize, and staple universal
        if: matrix.extra_arch == 'universal'
        env:
          MACOS_CODESIGN_IDENTITY: "Developer ID Application: BRANDON BROWNING STONE (K6N4J68LTY)"
          MACOS_REQUIRE_NOTARIZATION: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNCTHINGTRAY_RELEASE: ${{ needs.gate.outputs.release }}
          SYNCTHINGTRAY_VERSION: ${{ needs.gate.outputs.app_version }}
          SYNCTHINGTRAY_ARCH: universal
          SYNCTHINGTRAY_VERSION_DEBUG: "1"
          SPARKLE_ED_PUBLIC_KEY: ${{ needs.gate.outputs.sparkle_public_key }}
        run: ./scripts/package-macos.sh

      - name: Upload universal artifacts
        if: matrix.extra_arch == 'universal'
        uses: actions/upload-artifact@v6
        with:
          name: SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-universal
          path: |
            build/SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-universal.zip
            build/SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-universal.dmg
            build/SHA256SUMS-macos-universal
          if-no-files-found: error

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f "${MACOS_SIGNING_CERTIFICATE_PATH:-}"

  publish-release:
    name: Publish GitHub release
    if: needs.gate.outputs.release == '1'
    needs:
      - gate
      - package-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: SyncthingTray-${{ needs.gate.outputs.app_version }}-macos-*
          path: release-artifacts
          merge-multiple: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.gate.outputs.app_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ ! "${APP_VERSION}" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])\.[1-9][0-9]*$ ]]; then
            echo "Refusing to publish non-release version ${APP_VERSION}" >&2
            exit 1
          fi
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            cp "${asset}" "release-assets/$(basename "${asset}")"
          done < <(find release-artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) -print0)
          missing=0
          for arch in arm64 x86_64 universal; do
            for ext in zip dmg; do
              expected="release-assets/SyncthingTray-${APP_VERSION}-macos-${arch}.${ext}"
              if [[ ! -f "${expected}" ]]; then
                echo "Missing required artifact: ${expected}" >&2
                missing=1
              fi
            done
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Artifacts found:" >&2
            find release-artifacts -type f >&2 || true
            exit 1
          fi
          (
            cd release-assets
            sha256sum *.zip *.dmg | sort -k2 > SHA256SUMS
          )
          tag="v${APP_VERSION}"
          title="Syncthing Tray ${APP_VERSION}"
          notes="Developer ID-signed and notarized macOS builds for ${APP_VERSION}: dedicated Apple Silicon (arm64), dedicated Intel (x86_64), and universal."
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No zip/dmg/SHA256SUMS artifacts found to publish." >&2
            exit 1
          fi
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refusing to clobber." >&2
            exit 1
          fi
          if gh api --silent "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Tag ${tag} already exists; refusing to reuse N from workflow_dispatch." >&2
              exit 1
            fi
          fi
          gh release create "${tag}" --repo "${GH_REPO}" "${assets[@]}" --title "${title}" --notes "${notes}" --latest --target "${GITHUB_SHA}"

      - name: Sign dedicated-arch zips and publish Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.gate.outputs.app_version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY}" ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set; skipping Sparkle appcast. Set this Actions secret to the generate_keys Ed25519 seed before the first Sparkle-enabled publish."
            exit 0
          fi
          python3 -m pip install --user --break-system-packages pynacl
          python3 scripts/generate-sparkle-appcast.py \
            --version "${APP_VERSION}" \
            --repo "${GH_REPO}" \
            --output release-assets/appcast.xml \
            "release-assets/SyncthingTray-${APP_VERSION}-macos-arm64.zip" \
            "release-assets/SyncthingTray-${APP_VERSION}-macos-x86_64.zip"
          tag="v${APP_VERSION}"
          gh release upload "${tag}" release-assets/appcast.xml --repo "${GH_REPO}" --clobber
          if gh release view appcast --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload appcast release-assets/appcast.xml --repo "${GH_REPO}" --clobber
          else
            gh release create appcast release-assets/appcast.xml \
              --repo "${GH_REPO}" \
              --title "Sparkle appcast" \
              --notes "Durable Sparkle 2 appcast for Syncthing Tray. Updated on each real publish; this tag is not an app release." \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
          echo "Published Sparkle appcast with dedicated macos-arm64 and macos-x86_64 enclosures."
